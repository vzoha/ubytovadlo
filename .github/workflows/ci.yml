name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testy a statická analýza (${{ matrix.db.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db:
          # Lokální vývoj běží na MySQL 8.4, produkce na MariaDB — obojí musí projít.
          - name: MySQL 8.4
            image: mysql:8.4
            server_version: "8.4"
            ping: mysqladmin ping -uroot -proot
          - name: MariaDB 11.8
            image: mariadb:11.8
            server_version: "11.8.6-MariaDB"
            ping: mariadb-admin ping -uroot -proot

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ubytovadlo
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.ping }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: "mysql://app:app@127.0.0.1:3306/ubytovadlo?serverVersion=${{ matrix.db.server_version }}&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v5
        with:
          # Revize změněných souborů potřebuje historii pro merge-base.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imap, intl, gd, zip, pdo_mysql, mbstring, dom, xml, curl, openssl, gmp, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit (composer)
        if: matrix.db.name == 'MySQL 8.4'
        run: composer audit

      - name: Code style (php-cs-fixer)
        if: matrix.db.name == 'MySQL 8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Static analysis (PHPStan)
        if: matrix.db.name == 'MySQL 8.4'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Clean code (PHPMD na změněných souborech)
        if: matrix.db.name == 'MySQL 8.4'
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tools/review-changed.sh "origin/${{ github.base_ref }}"
          else
            tools/review-changed.sh HEAD~1
          fi

      - name: Grant privileges on test database
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ubytovadlo_test; GRANT ALL PRIVILEGES ON ubytovadlo_test.* TO 'app'@'%'; FLUSH PRIVILEGES;"

      - name: Prepare test database
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit
