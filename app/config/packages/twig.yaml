twig:
    file_name_pattern: '*.twig'
    form_themes: ['bootstrap_5_layout.html.twig']
    globals:
        issuer: '@App\Invoice\IssuerProfileProvider'
        tax_profile: '@App\Invoice\TaxProfileConfig'
        brand_name: '@App\Config\BrandName'
        instance: '@App\Config\InstanceSettings'
        mail_settings: '@App\Mail\MailSettingsProvider'
        guest_locale: '@App\Mail\GuestLocaleResolver'
        product_name: 'Ubytovadlo'
        product_url: 'https://ubytovadlo.cz'
        product_repo_url: 'https://github.com/vzoha/ubytovadlo'

when@test:
    twig:
        strict_variables: true
